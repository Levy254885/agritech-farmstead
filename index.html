<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agritech Farmstead | Fresh Farm Produce Online Store</title>
<meta name="description" content="Buy fresh dairy, beef, pork, chevon, kienyeji and broiler chicken, ducks and eggs direct from the farm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2e9e4f;--gd:#1b6e35;--gx:#e9f6ed;--o:#f58220;--ink:#222;--mut:#6b7280;--bd:#e5e7eb;--bg:#f4f6f4}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.w{max-width:1240px;margin:0 auto;padding:0 16px}
/* topbar */
.top{background:var(--gd);color:#fff;font-size:12.5px}
.top .w{display:flex;justify-content:space-between;align-items:center;height:36px}
.top a:hover{text-decoration:underline}.top span{margin-left:18px}
/* header */
.hd{background:#fff;border-bottom:1px solid var(--bd)}
.hd .w{display:flex;align-items:center;gap:22px;height:76px}
.logo{font-weight:800;font-size:22px;color:var(--gd);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;background:var(--g);color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px}
.logo b{color:var(--o)}
.search{flex:1;display:flex;border:2px solid var(--g);border-radius:8px;overflow:hidden;background:#fff}
.search select{border:0;border-right:1px solid var(--bd);padding:0 12px;background:var(--gx);font:inherit;font-size:13px;max-width:170px}
.search input{flex:1;border:0;padding:12px 14px;font:inherit;min-width:0;outline:0}
.search button{background:var(--g);color:#fff;border:0;padding:0 22px;font-weight:600}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--gx);border:0;border-radius:8px;padding:10px 16px;font-weight:600;color:var(--gd);white-space:nowrap}
.cartbtn em{background:var(--o);color:#fff;font-style:normal;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
/* nav */
.nav{background:var(--g);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nav .w{display:flex;align-items:stretch;height:48px}
.cat{position:relative}
.cat>button{height:100%;background:var(--gd);color:#fff;border:0;padding:0 22px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;min-width:230px}
.cat ul{display:none;position:absolute;top:48px;left:0;background:#fff;color:var(--ink);list-style:none;width:260px;box-shadow:0 12px 28px rgba(0,0,0,.18);border-radius:0 0 8px 8px;z-index:50}
.cat:hover ul,.cat.open ul{display:block}
.cat li button{width:100%;text-align:left;background:none;border:0;padding:11px 18px;border-bottom:1px solid var(--bd);font-size:14px}
.cat li button:hover{background:var(--gx);color:var(--gd)}
.links{display:flex;margin-left:8px}
.links a{display:flex;align-items:center;padding:0 16px;font-weight:500}
.links a:hover{background:rgba(255,255,255,.15)}
.bg{display:none;background:none;border:0;color:#fff;font-size:24px;margin-left:auto;padding:0 12px}
/* hero */
.hero{margin-top:16px;position:relative;border-radius:12px;overflow:hidden;height:420px;background:var(--gd)}
.sl{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;background-size:cover;background-position:center;color:#fff}
.sl.on{opacity:1;visibility:visible}
.sl::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,40,20,.85),rgba(10,40,20,.35) 65%,rgba(10,40,20,.1))}
.sl .in{position:relative;height:100%;padding:0 56px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.tag{background:var(--o);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;margin-bottom:14px}
.sl h1{font-size:clamp(26px,4.4vw,48px);line-height:1.12;font-weight:800;max-width:560px}
.sl p{max-width:440px;margin:12px 0 22px;font-size:15px;opacity:.95}
.btn{display:inline-block;background:var(--o);color:#fff;border:0;border-radius:8px;padding:12px 26px;font-weight:600;font-size:14px;transition:transform .2s,background .2s}
.btn:hover{background:#dd6f10;transform:translateY(-2px)}
.btn.g{background:var(--g)}.btn.g:hover{background:var(--gd)}
.dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3}
.dots button{width:10px;height:10px;border-radius:99px;border:0;background:rgba(255,255,255,.5);transition:width .3s}
.dots button[aria-selected=true]{background:var(--o);width:30px}
.ar{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:20px;color:var(--gd)}
.ar:hover{background:var(--o);color:#fff}.ar.p{left:14px}.ar.n{right:14px}
/* sections */
.sec{margin-top:30px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sh h2{font-size:20px;font-weight:700;color:var(--gd);padding-left:12px;border-left:4px solid var(--o)}
.sh a,.sh button{color:var(--g);font-weight:600;background:none;border:0;font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.tile{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px 6px;text-align:center;transition:.2s}
.tile:hover,.tile.on{border-color:var(--g);box-shadow:0 6px 16px rgba(46,158,79,.18);transform:translateY(-3px)}
.tile.on{background:var(--gx)}
.tile b{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--gx);margin:0 auto 8px;font-size:30px}
.tile span{font-weight:600;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column;transition:.2s}
.card:hover{box-shadow:0 10px 24px rgba(0,0,0,.1);transform:translateY(-3px)}
.bd{position:absolute;top:10px;left:10px;z-index:2;background:var(--o);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
.bd.f{background:var(--g)}
.ph{aspect-ratio:1/1;background:linear-gradient(135deg,var(--gx),#cfe8d6);display:grid;place-items:center;font-size:64px;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.bo small{color:var(--mut);font-size:12px}
.bo h3{font-size:14.5px;font-weight:600;line-height:1.3}
.pr{font-weight:700;color:var(--gd);font-size:17px}.pr s{display:none}.pr small{font-weight:500}
.ad{margin-top:auto;padding-top:8px}
.ad .btn{width:100%;padding:10px;border-radius:8px}
.qty{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--g);border-radius:8px;overflow:hidden}
.qty button{background:var(--g);color:#fff;border:0;width:38px;height:36px;font-size:18px}
.qty span{font-weight:700}
/* promos */
.promos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pm{border-radius:12px;padding:26px;color:#fff;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.pm::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.15))}
.pm>*{position:relative}.pm small{font-weight:600;color:#ffd9a8}
.pm h3{font-size:20px;line-height:1.2;max-width:200px}
.pm .btn{padding:8px 18px;margin-top:6px;font-size:13px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:20px}
.trust div{display:flex;gap:12px;align-items:center}.trust b{font-size:28px}.trust strong{display:block}.trust small{color:var(--mut)}
/* reviews */
.rvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.rv{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:18px}
.st{color:var(--o);letter-spacing:2px}.rv p{margin:8px 0 10px}.rv small{color:var(--mut)}
.em{grid-column:1/-1;background:#fff;border:2px dashed var(--g);border-radius:12px;padding:26px;text-align:center}
.rf{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:22px;display:grid;gap:10px;max-width:560px;margin-top:16px}
.rf h3{color:var(--gd)}
.rf input,.rf select,.rf textarea{border:1.5px solid var(--bd);border-radius:8px;padding:11px;font:inherit;width:100%}
/* footer */
footer{background:#14331f;color:#cfe3d5;margin-top:40px;padding:40px 0 0}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:30px}
footer h4{color:#fff;margin-bottom:12px}footer li{list-style:none;margin-bottom:7px}footer a:hover{color:var(--o)}
.cp{border-top:1px solid rgba(255,255,255,.12);margin-top:30px;padding:16px 0;text-align:center;font-size:12.5px}
/* cart */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:.3s;z-index:90}
.ov.on{opacity:1;visibility:visible}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;z-index:100;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.dr.on{transform:none}
.dr header{padding:16px 18px;background:var(--g);color:#fff;display:flex;justify-content:space-between;font-weight:700}
.dr header button{background:none;border:0;color:#fff;font-size:22px}
#ci{flex:1;overflow:auto;padding:12px 18px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.ln small{color:var(--mut);display:block}
.ln .qty{width:104px;flex:none}.ln .qty button{width:30px;height:30px}
.df{padding:16px 18px;border-top:1px solid var(--bd)}
.df p{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:10px}
.df .btn{width:100%;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--gd);color:#fff;padding:11px 20px;border-radius:99px;z-index:120;transition:transform .3s;font-weight:500}
.toast.on{transform:translate(-50%,0)}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(4,1fr)}.promos{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}.trust{grid-template-columns:1fr 1fr}}
@media(max-width:760px){
 .top .w>div:last-child{display:none}
 .hd .w{flex-wrap:wrap;height:auto;padding:12px 16px;gap:10px}.search{order:3;flex-basis:100%}.search select{display:none}.cartbtn{margin-left:auto}
 .links{display:none;position:absolute;top:48px;left:0;right:0;background:var(--g);flex-direction:column;margin:0}.links.open{display:flex}.links a{padding:14px 18px}
 .bg{display:block}.cat>button{min-width:0}.hero{height:360px}.sl .in{padding:0 24px}.ar{display:none}
 .tiles{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.fg{grid-template-columns:1fr}.trust{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="top"><div class="w"><div id="tl"></div><div id="tr"></div></div></div>
<div class="hd"><div class="w">
  <a class="logo" href="#top"><i>🌾</i><span>Agritech <b>Farmstead</b></span></a>
  <form class="search" id="sf"><select id="ss" aria-label="Category"></select><input id="sq" type="search" placeholder="Search beef, eggs, milk..." aria-label="Search"><button type="submit">Search</button></form>
  <button class="cartbtn" id="cb">🛒 Cart <em id="cc">0</em></button>
</div></div>
<div class="nav"><div class="w">
  <div class="cat" id="catw"><button id="catb">☰ Shop by Category ▾</button><ul id="catl"></ul></div>
  <nav class="links" id="lk"><a href="#shop">Shop</a><a href="#deals">Farm Specials</a><a href="#about">About Us</a><a href="#reviews">Reviews</a><a href="#contact">Contact</a></nav>
  <button class="bg" id="bg" aria-label="Menu">☰</button>
</div></div>

<main class="w" id="top">
  <div class="hero" id="hero" aria-roledescription="carousel"><div id="sls"></div><button class="ar p" id="pv" aria-label="Previous">‹</button><button class="ar n" id="nx" aria-label="Next">›</button><div class="dots" id="dt" role="tablist"></div></div>

  <section class="sec" id="cats"><div class="sh"><h2>What are you shopping?</h2><button onclick="setCat('All')">See all</button></div><div class="tiles" id="tiles"></div></section>

  <section class="sec" id="shop"><div class="sh"><h2 id="gt">Top selling products</h2><span id="gc" style="color:var(--mut)"></span></div><div class="grid" id="grid"></div></section>

  <section class="sec" id="deals"><div class="sh"><h2>Farm specials</h2></div><div class="promos" id="promos"></div></section>

  <section class="sec"><div class="trust" id="trust"></div></section>

  <section class="sec" id="about"><div class="sh"><h2>About the farm</h2></div>
    <div class="rv" id="ab" style="padding:24px;font-size:15px;line-height:1.7"></div></section>

  <section class="sec" id="reviews"><div class="sh"><h2>Customer reviews</h2></div>
    <div class="rvg" id="rvg"></div>
    <form class="rf" id="rf"><h3>Leave a review</h3><input name="name" placeholder="Your name" required>
      <select name="rating" aria-label="Rating"><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ Okay</option><option value="2">★★ Poor</option><option value="1">★ Bad</option></select>
      <textarea name="text" rows="3" placeholder="What did you buy or see on your visit?" required></textarea>
      <button class="btn g" type="submit">Send review</button></form></section>
</main>

<footer id="contact"><div class="w"><div class="fg" id="fg"></div><div class="cp" id="cp"></div></div></footer>

<div class="ov" id="ov"></div>
<aside class="dr" id="dr" aria-label="Cart"><header><span>Your cart</span><button id="cx" aria-label="Close">✕</button></header><div id="ci"></div>
  <div class="df"><p><span>Total</span><span id="ct">KES 0</span></p><a class="btn g" id="co" href="#">Order on WhatsApp</a></div></aside>
<div class="toast" id="ts"></div>

<script>
/* =====================================================
   EDIT HERE. All content lives in this one object.
   Put images in the /images folder next to index.html.
   ===================================================== */
const SITE={
  name:"Agritech Farmstead",
  whatsapp:"254700000000",          // CHANGE: client number, no + or spaces
  phone:"+254 700 000 000",         // CHANGE
  email:"hello@agritechfarmstead.co.ke", // CHANGE
  location:"Kenya",                 // CHANGE: town / county
  topline:"Fresh from the farm to your table",
  slideSeconds:6,

  hero:[
    {tag:"Dairy",   title:"Fresh milk from our own herd",      text:"Chilled, clean and delivered the same day.", image:"images/hero-dairy.jpg",   color:"#1f6b3a", cat:"Dairy"},
    {tag:"Pigs",    title:"Quality pork, raised with care",     text:"Fresh pork cut to order at KES 600 per kg.",  image:"images/hero-pigs.jpg",    color:"#6b4a2f", cat:"Pork"},
    {tag:"Chicken", title:"Kienyeji and broiler chicken",       text:"Free-range kienyeji and fresh broilers, plus farm eggs.", image:"images/hero-chicken.jpg", color:"#8a5a12", cat:"Poultry"},
    {tag:"Ducks",   title:"Healthy ducks from our ponds",       text:"Raised on open water and grass. Ask for availability.", image:"images/hero-ducks.jpg",   color:"#245b73", cat:"Ducks"}
  ],

  // Tiles = "What are you shopping?" (name must match product category)
  categories:[
    {name:"Dairy",         icon:"🥛"},
    {name:"Beef",          icon:"🥩"},
    {name:"Pork",          icon:"🥓"},
    {name:"Goat (Chevon)", icon:"🐐"},
    {name:"Poultry",       icon:"🍗"},
    {name:"Eggs",          icon:"🥚"},
    {name:"Ducks",         icon:"🦆"},
    {name:"Pigs (live)",   icon:"🐖"}
  ],

  // price:null shows "Ask for price". badge: "Fresh" | "Hot" | "" . image goes in /images. Missing image shows the icon.
  products:[
    {name:"Fresh Milk",         cat:"Dairy",         price:null, unit:"",         icon:"🥛", image:"images/milk.jpg",     badge:"Fresh"},
    {name:"Beef",               cat:"Beef",          price:650,  unit:"per kg",   icon:"🥩", image:"images/beef.jpg",     badge:"Hot"},
    {name:"Pork",               cat:"Pork",          price:600,  unit:"per kg",   icon:"🥓", image:"images/pork.jpg",     badge:"Hot"},
    {name:"Chevon (Goat Meat)", cat:"Goat (Chevon)", price:850,  unit:"per kg",   icon:"🐐", image:"images/chevon.jpg",   badge:""},
    {name:"Kienyeji Chicken",   cat:"Poultry",       price:1500, unit:"per kg",   icon:"🐓", image:"images/kienyeji.jpg", badge:"Hot"},
    {name:"Broiler Chicken",    cat:"Poultry",       price:500,  unit:"per kg",   icon:"🍗", image:"images/broiler.jpg",  badge:"Fresh"},
    {name:"Kienyeji Eggs",      cat:"Eggs",          price:700,  unit:"per tray", icon:"🥚", image:"images/eggs.jpg",     badge:"Fresh"},
    {name:"Ducks",              cat:"Ducks",         price:null, unit:"",         icon:"🦆", image:"images/ducks.jpg",    badge:""},
    {name:"Pigs (live)",        cat:"Pigs (live)",   price:null, unit:"",         icon:"🐖", image:"images/pigs.jpg",     badge:""}
  ],

  promos:[
    {small:"Dairy",    title:"Fresh milk, every morning", btn:"Shop dairy",   cat:"Dairy",   image:"images/promo-dairy.jpg",   color:"#2e7d4f"},
    {small:"Meat",     title:"Beef, pork and chevon",     btn:"Shop meat",    cat:"Beef",    image:"images/promo-meat.jpg",    color:"#8a3b2e"},
    {small:"Poultry",  title:"Kienyeji chicken and eggs", btn:"Shop poultry", cat:"Poultry", image:"images/promo-poultry.jpg", color:"#b0741c"}
  ],

  trust:[
    {icon:"🌱",t:"Farm fresh",d:"Raised and sold by us"},
    {icon:"🚚",t:"Delivery",d:"Ask about your area"},
    {icon:"💬",t:"Order on WhatsApp",d:"Quick and direct"},
    {icon:"✅",t:"Fair prices",d:"No middlemen"}
  ],

  about:"Agritech Farmstead raises dairy cattle, pigs, goats, chickens and ducks on one farm. We keep our animals healthy and our process simple, from feeding to the final cut. Whether you want a litre of milk, a tray of eggs or meat for the weekend, you buy direct from the people who raised it.",

  // Add real reviews here as they come in. Leave [] to show the invitation.
  reviews:[
    // {name:"Jane W.", rating:5, text:"The kienyeji chicken was the best I've had.", date:"Nov 2026"}
  ]
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const wa=t=>`https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(t)}`;
const kes=n=>"KES "+n.toLocaleString("en-KE");
let cat="All",q="",cart={};
const toast=m=>{const t=$("#ts");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1800)};

/* ---------- static bits ---------- */
$("#tl").textContent=SITE.topline;
$("#tr").innerHTML=`<span>📞 ${SITE.phone}</span><a href="${wa('Hello, I have a question.')}"><span>WhatsApp</span></a>`;
$("#ss").innerHTML=`<option>All</option>`+SITE.categories.map(c=>`<option>${c.name}</option>`).join("");
$("#catl").innerHTML=`<li><button data-c="All">All products</button></li>`+SITE.categories.map(c=>`<li><button data-c="${c.name}">${c.icon} ${c.name}</button></li>`).join("");
$("#tiles").innerHTML=SITE.categories.map(c=>`<button class="tile" data-c="${c.name}"><b>${c.icon}</b><span>${c.name}</span></button>`).join("");
$("#promos").innerHTML=SITE.promos.map(p=>`<div class="pm" style="background-color:${p.color};background-image:url('${p.image}')"><small>${p.small}</small><h3>${p.title}</h3><button class="btn" data-c="${p.cat}">${p.btn}</button></div>`).join("");
$("#trust").innerHTML=SITE.trust.map(t=>`<div><b>${t.icon}</b><div><strong>${t.t}</strong><small>${t.d}</small></div></div>`).join("");
$("#ab").textContent=SITE.about;
$("#fg").innerHTML=`<div><h4>🌾 ${SITE.name}</h4><p>${SITE.topline}. Based in ${SITE.location}.</p></div>
<div><h4>Shop</h4><ul>${SITE.categories.slice(0,5).map(c=>`<li><a href="#shop" data-c="${c.name}">${c.name}</a></li>`).join("")}</ul></div>
<div><h4>Company</h4><ul><li><a href="#about">About us</a></li><li><a href="#reviews">Reviews</a></li><li><a href="#top">Back to top</a></li></ul></div>
<div><h4>Contact</h4><ul><li>${SITE.phone}</li><li>${SITE.email}</li><li><a href="${wa('Hello, I would like to order.')}">Chat on WhatsApp</a></li></ul></div>`;
$("#cp").textContent=`© ${new Date().getFullYear()} ${SITE.name}. All rights reserved.`;

/* ---------- hero ---------- */
let cur=0,tm;
SITE.hero.forEach((s,i)=>{
  const d=document.createElement("div");d.className="sl";d.style.backgroundColor=s.color;d.style.backgroundImage=`url('${s.image}')`;
  d.innerHTML=`<div class="in"><span class="tag">${s.tag}</span><h1>${s.title}</h1><p>${s.text}</p><button class="btn" data-c="${s.cat}">Shop now</button></div>`;
  $("#sls").appendChild(d);
  const b=document.createElement("button");b.setAttribute("role","tab");b.setAttribute("aria-label","Slide "+(i+1));b.onclick=()=>go(i);$("#dt").appendChild(b);
});
function go(i){cur=(i+SITE.hero.length)%SITE.hero.length;$$(".sl").forEach((s,k)=>s.classList.toggle("on",k===cur));$$("#dt button").forEach((b,k)=>b.setAttribute("aria-selected",k===cur));clearInterval(tm);tm=setInterval(()=>go(cur+1),SITE.slideSeconds*1000)}
$("#nx").onclick=()=>go(cur+1);$("#pv").onclick=()=>go(cur-1);
let sx=0;$("#hero").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
$("#hero").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(cur+(d<0?1:-1))});
go(0);

/* ---------- catalogue ---------- */
function setCat(c,scroll){cat=c;q="";$("#sq").value="";$("#ss").value=c;render();$("#catw").classList.remove("open");if(scroll!==false)$("#shop").scrollIntoView({behavior:"smooth"})}
function render(){
  $$(".tile").forEach(t=>t.classList.toggle("on",t.dataset.c===cat));
  const list=SITE.products.filter(p=>(cat==="All"||p.cat===cat)&&(!q||(p.name+" "+p.cat).toLowerCase().includes(q)));
  $("#gt").textContent=q?`Results for "${q}"`:cat==="All"?"Top selling products":cat;
  $("#gc").textContent=list.length+" item"+(list.length===1?"":"s");
  $("#grid").innerHTML=list.length?list.map(p=>{const i=SITE.products.indexOf(p),n=cart[i]||0;return `<article class="card">
    ${p.badge?`<span class="bd ${p.badge==='Fresh'?'f':''}">${p.badge}</span>`:""}
    <div class="ph"><span aria-hidden="true">${p.icon}</span><img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.remove()"></div>
    <div class="bo"><small>${p.cat}</small><h3>${p.name}</h3>
    <div class="pr">${p.price?kes(p.price)+' <small>'+p.unit+'</small>':'<small>Ask for price</small>'}</div>
    <div class="ad">${n?`<div class="qty"><button data-m="${i}" aria-label="Less">−</button><span>${n}</span><button data-a="${i}" aria-label="More">+</button></div>`:p.price?`<button class="btn g" data-a="${i}">Add to cart</button>`:`<a class="btn g" style="display:block;text-align:center" href="${wa('Hello, I would like to ask about: '+p.name)}">Ask on WhatsApp</a>`}</div></div></article>`}).join(""):`<div class="em" style="grid-column:1/-1">Nothing matched. Try another word or <button class="btn g" onclick="setCat('All')">see all products</button></div>`;
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-c]");if(c){e.preventDefault();setCat(c.dataset.c)}
  const a=e.target.closest("[data-a]");if(a){add(+a.dataset.a,1)}
  const m=e.target.closest("[data-m]");if(m){add(+m.dataset.m,-1)}
});
$("#sf").onsubmit=e=>{e.preventDefault();q=$("#sq").value.trim().toLowerCase();cat=$("#ss").value;render();$("#shop").scrollIntoView({behavior:"smooth"})};
$("#ss").onchange=()=>{cat=$("#ss").value;q="";render()};
$("#catb").onclick=()=>$("#catw").classList.toggle("open");

/* ---------- cart ---------- */
function add(i,d){const n=(cart[i]||0)+d;if(n<=0)delete cart[i];else cart[i]=n;if(d>0&&n===1)toast(SITE.products[i].name+" added");renderCart();render()}
function renderCart(){
  const ids=Object.keys(cart);let total=0,count=0;
  $("#ci").innerHTML=ids.length?ids.map(i=>{const p=SITE.products[i],n=cart[i];total+=p.price*n;count+=n;return `<div class="ln"><div><strong>${p.name}</strong><small>${kes(p.price)} ${p.unit}</small></div><div class="qty"><button data-m="${i}">−</button><span>${n}</span><button data-a="${i}">+</button></div></div>`}).join(""):`<p style="padding:30px 0;text-align:center;color:var(--mut)">Your cart is empty.</p>`;
  $("#cc").textContent=count;$("#ct").textContent=kes(total);
  const lines=ids.map(i=>`${cart[i]} x ${SITE.products[i].name} (${SITE.products[i].unit})`).join("%0A");
  $("#co").href=ids.length?`https://wa.me/${SITE.whatsapp}?text=Hello, I would like to order:%0A${lines}%0ATotal: ${kes(total)}`:"#";
}
const open=o=>{$("#dr").classList.toggle("on",o);$("#ov").classList.toggle("on",o)};
$("#cb").onclick=()=>open(true);$("#cx").onclick=$("#ov").onclick=()=>open(false);

/* ---------- reviews ---------- */
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
$("#rvg").innerHTML=SITE.reviews.length?SITE.reviews.map(r=>`<div class="rv"><div class="st">${stars(r.rating)}</div><p>${r.text}</p><small>${r.name}${r.date?', '+r.date:''}</small></div>`).join(""):`<div class="em"><strong>Be our first reviewer</strong><p style="color:var(--mut)">Bought from us or visited the farm? Tell us about it below.</p></div>`;
$("#rf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);window.open(wa(`New review (${f.get('rating')}/5) from ${f.get('name')}: ${f.get('text')}`),"_blank");e.target.reset()};

/* ---------- chrome ---------- */
$("#bg").onclick=()=>$("#lk").classList.toggle("open");$("#lk").onclick=()=>$("#lk").classList.remove("open");
render();renderCart();
</script>
</body>
</html>
